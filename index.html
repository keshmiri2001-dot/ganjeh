<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ganjeh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a0b3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Layout: phone-first, glass cards over a violet crystal ground. Gold is the only warm colour (logo, key numbers, actions).
   Header crest with spinning angel in a gold ring; a crystal angel spins at the right edge; inventory is a table. */
:root{
  --bg:#12082a; --surface:rgba(255,255,255,.055); --solid:#1f1042; --fg:#f4eeff; --muted:#bba9e0; --line:rgba(255,255,255,.16);
  --accent:#f1c963; --accent-ink:#2a1450; --accent-bg:rgba(241,201,99,.14); --good:#7be3b0; --bad:#ff9aa2;
  --bar:rgba(176,140,255,.55); --l1:#f1c963; --l2:#8fd3ff; --l3:#ff9aa2;
  --font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:680px;color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;
  background:var(--bg);
  padding-block:12px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(70% 45% at 85% 0%,#6a35c4aa 0%,transparent 70%),
   radial-gradient(60% 40% at 0% 45%,#3c1f8a99 0%,transparent 70%),
   radial-gradient(70% 40% at 100% 100%,#512a9f88 0%,transparent 70%),
   linear-gradient(165deg,#1b0c40 0%,#0f0626 55%,#1d0d49 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:
   linear-gradient(118deg,transparent 0 22%,#ffffff0d 22% 23%,transparent 23% 41%,#ffffff08 41% 41.6%,transparent 41.6% 100%),
   linear-gradient(62deg,transparent 0 55%,#ffffff0b 55% 56%,transparent 56% 78%,#ffffff07 78% 78.6%,transparent 78.6% 100%),
   linear-gradient(160deg,#ffffff00 0 30%,#b894ff10 30% 52%,#ffffff00 52% 100%)}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:inset 0 1px 0 #ffffff26,0 6px 20px #0000002e}

/* ---------- side angel ---------- */
#angel-side{position:fixed;right:-34px;top:20vh;height:60vh;aspect-ratio:100/120;z-index:0;pointer-events:none;perspective:900px;opacity:.55}
#angel-side svg{width:100%;height:100%;display:block;animation:spin 11s linear infinite;filter:drop-shadow(0 0 18px #a879ff88)}
main{position:relative;z-index:1}
html,body{touch-action:pan-y}
.tbl-wrap{touch-action:pan-x pan-y}

/* ---------- crest ---------- */
.top{margin-bottom:16px}
.crest{position:relative;overflow:hidden;border-radius:24px;padding:10px 14px 10px;text-align:center;direction:ltr;
  background:radial-gradient(120% 90% at 50% 0%,#4a2a92 0%,#241250 50%,#12082c 100%);
  border:1px solid #8d6d2e;box-shadow:inset 0 1px 0 #ffffff22,inset 0 0 0 4px #14092f,inset 0 0 0 5px #6b5420,0 10px 28px #00000055}
.logo3d{perspective:600px;width:130px;margin:0 auto}
.logo-img{display:block;width:130px;height:auto;transform-style:preserve-3d;filter:drop-shadow(0 6px 14px #f1c96344);animation:sway 7s ease-in-out infinite,glint 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-32deg)}50%{transform:rotateY(32deg)}}
@keyframes glint{0%,100%{filter:drop-shadow(0 6px 14px #f1c96344) brightness(1)}50%{filter:drop-shadow(0 6px 22px #f1c96399) brightness(1.3)}}
.logo{position:relative;width:200px;height:170px;margin:0 auto 4px;perspective:700px}
.logo .spin{position:absolute;left:25px;top:10px;width:150px;height:150px;animation:spin 8s linear infinite;filter:drop-shadow(0 6px 14px #f1c96355)}
.logo svg{width:100%;height:100%;display:block}
.sp{position:absolute;width:16px;height:16px;background:#fff1b8;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:twinkle 2.6s ease-in-out infinite;filter:drop-shadow(0 0 4px #ffd978)}
.crest h1{margin:0;font-family:'Cormorant Garamond','Times New Roman',Georgia,serif;font-weight:700;font-size:30px;letter-spacing:.34em;padding-inline-start:.34em;line-height:1.05;
  background:linear-gradient(180deg,#fff1b8 0%,#e7bb4c 48%,#a8731a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.crest .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px auto 4px;max-width:240px}
.crest .rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a24a)}
.crest .rule i:last-child{transform:scaleX(-1)}
.crest .rule b{width:7px;height:7px;background:#e7bb4c;transform:rotate(45deg);display:block}
.crest .tag{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10px;letter-spacing:.6em;padding-inline-start:.6em;color:#cdb273;text-transform:uppercase}
.crest .date{color:#b9a9de;margin-top:10px;direction:rtl;font-size:13px}
#share-btn{display:block;margin:16px auto 24px;min-height:0;padding:9px 20px;border-radius:999px;background:linear-gradient(180deg,#f6d77a,#c9a24a);color:#2a1660;border:0;font-weight:800;font-size:15px;box-shadow:0 4px 14px #f1c96344}
#help-btn{position:absolute;top:12px;left:12px;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;background:#ffffff14;border:1px solid #ffffff33;color:#f1c963;font-weight:700;font-size:18px}

@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes flapL{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-13deg)}}
@keyframes flapR{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(13deg)}}
.wl{transform-origin:44px 44px;animation:flapL 1.7s ease-in-out infinite}
.wr{transform-origin:56px 44px;animation:flapR 1.7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#angel-side svg,.logo-img,.logo .spin,.wl,.wr,.sp{animation:none}.sp{opacity:.8}}

/* ---------- boxes ---------- */
.tile,.ptile{text-align:center;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:inset 0 1px 0 #ffffff26}
.tile .k{font-size:14px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .u{font-size:13px;color:var(--muted);font-weight:400}
.ptile{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ptile .v{font-size:25px}
.ptile{padding:9px 10px;gap:0}
.ptile.full .v{font-size:36px;color:var(--accent)}
.ptile:active{transform:scale(.985)}
.refbtn{text-align:center;color:var(--accent);font-weight:700;min-height:58px;font-size:17px;border-color:#f1c96366}
.upd{font-size:12px;color:var(--muted);min-height:17px}
.upd b{color:var(--good);font-weight:500}
.hero{grid-column:1/-1;padding:10px 14px!important;background:linear-gradient(135deg,#f1c96326,#b894ff1f);border:1px solid #f1c96355;border-radius:16px;padding:16px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hero .k{font-size:15px;color:var(--accent)}
.hero .big{font-size:34px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.hero .big small{font-size:14px;font-weight:500}
.hero .s{font-size:15px;margin-top:4px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- controls ---------- */
label{display:block;font-size:15px;color:var(--muted);margin-bottom:3px}
input,select,textarea{font:inherit;font-size:17px;color:var(--fg);background:#0000003d;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input[dir=ltr]{text-align:right}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#ffffff12;color:var(--fg);padding:9px 14px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent}
button.small{min-height:34px;padding:3px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid .full{grid-column:1/-1}
.card{padding:14px;margin-bottom:12px;min-width:0}
.hidden-form{display:none}
.photo-btn{display:inline-block;border:1px dashed var(--accent);color:var(--accent);border-radius:12px;padding:10px 14px;cursor:pointer;margin:0;font-weight:700}
.photo-prev{max-width:100%;max-height:200px;border-radius:12px;margin-top:8px;display:block}
.preview{font-size:14px;background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:8px 12px}
.msg{color:var(--bad);font-size:14px;min-height:20px}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 6px}

/* ---------- inventory table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#0000002e}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:15px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:#2a1760;color:var(--accent);font-weight:700;font-size:13px;text-align:center;padding:10px 10px;border-bottom:1px solid #f1c96366;white-space:nowrap}
tbody td,tfoot td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:#ffffff08}
td.sticky,th.sticky{position:sticky;right:0;z-index:2}
td.sticky{background:#25135a;text-align:start;min-width:150px}
th.sticky{z-index:3}
tfoot td{background:#f1c9631a;color:var(--accent);font-weight:700;border-bottom:0}
tfoot td.sticky{background:#3a2a4d}
.cellid{display:flex;align-items:center;gap:8px}
.ph{width:38px;height:38px;border-radius:9px;overflow:hidden;background:#ffffff14;flex:none;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pill{display:inline-block;border-radius:99px;padding:0 10px;font-size:13px;font-weight:700}
.pill.up{background:#7be3b02e;color:var(--good)}
.pill.dn{background:#ff9aa22e;color:var(--bad)}
.pill.na{background:var(--accent-bg);color:var(--accent)}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:5;display:flex;justify-content:center;background:#150a30d9;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;gap:6px;width:100%;max-width:680px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:15px;min-height:50px;border-radius:14px}
nav.tabs button[aria-selected=true]{background:var(--accent-bg);color:var(--accent);font-weight:700}

/* ---------- charts & facts ---------- */
.chart{direction:ltr;width:100%;overflow:hidden}
.chart svg{width:100%;height:auto;display:block}
.tx{fill:var(--muted);font-size:9px;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
ul.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:16px}
ul.facts li:last-child{border:0;padding:0}
ul.facts li b{font-variant-numeric:tabular-nums;text-align:left}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#viewer{background:#000000e6;z-index:60}
#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#viewer button{position:absolute;top:max(16px,env(safe-area-inset-top,0px));inset-inline-start:16px}
#sheet{align-items:flex-end;background:#0a041acc;padding:0}
#sheet .box{width:100%;max-width:680px;max-height:88vh;overflow:auto;background:#1c0e44f2;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
#splash{z-index:80;background:#0c0520f2;flex-direction:column;gap:12px}
#splash img{max-height:82vh;max-width:92vw;width:auto;height:auto;border-radius:20px;box-shadow:0 10px 40px #000a;display:block}
#splash .bar{width:min(92vw,360px);height:5px;border-radius:5px;background:#ffffff26;overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f1c963,#fff1b8);transform-origin:right;animation:drain 5s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
#splash button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-start:14px}
#tour{z-index:70;background:#0a041acc}
#tour .box{width:min(94vw,420px);padding:22px 20px 18px;text-align:center;background:#24125aee;border:1px solid #f1c96366;border-radius:22px}
#tour .ic{font-size:44px;line-height:1.2;margin-bottom:6px}
#tour h3{margin:0 0 8px;font-size:20px;color:var(--accent)}
#tour p{margin:0;font-size:16px;color:var(--fg)}
#tour .dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
#tour .dots i{width:8px;height:8px;border-radius:50%;background:#ffffff33}
#tour .dots i.on{background:var(--accent)}
[hidden]{display:none!important}
</style>

    <linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6eeff"/><stop offset=".45" stop-color="#b78fff"/><stop offset="1" stop-color="#5a2fb2"/></linearGradient>
    <linearGradient id="cg2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d8ff"/><stop offset=".55" stop-color="#9a6bff"/><stop offset="1" stop-color="#3f1f8c"/></linearGradient>

</svg>

<script>
(function(){
'use strict';
var SRC='<!doctype html>\n'+document.documentElement.outerHTML;   // نسخهٔ سالمِ خود برنامه (بدون اطلاعات کاربر) برای ارسال
/* ---- settings ---- */
var ALLOWED_HOSTS=[];            // برای قفل دامنه: نام دامنهٔ خودتان را اینجا بنویسید، مثلاً ['ganjeh.example.ir']
var TGJU_URL='https://call4.tgju.org/ajax.json';   // منبع قیمت: tgju، مستقیم از خود برنامه (بدون سرور)
var BANNERS_URL='banners.json';
var SHARE_URL='';               // خالی = نشانی خود برنامه؛ یا نشانی کوتاه/دامنهٔ رسمی را اینجا بنویسید
var POLL_MS=15*60*1000;
var SPLASH_MS=5000;
var BUILTIN_BANNERS=[{id:'b1',image:'ads/b1.webp'},{id:'b2',image:'ads/b2.webp'},{id:'b3',image:'ads/b3.webp'}];

if(ALLOWED_HOSTS.length&&ALLOWED_HOSTS.indexOf(location.hostname)<0){document.body.innerHTML='<p style="padding:40px;text-align:center;color:#fff">این نسخه مجاز نیست.</p>';return;}
document.addEventListener('contextmenu',function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();});
document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&/^[usp]$/i.test(e.key)||e.key==='F12')e.preventDefault();});

var KEY='ganjeh-v2',OLDKEY='gold-cabinet-v1';
var PKEYS=['g18','usd','aed','oz','btc'];
var PNAME={g18:'طلای ۱۸ عیار، هر گرم',usd:'دلار',aed:'درهم',oz:'انس جهانی',btc:'بیت‌کوین'};
var PUNIT={g18:'تومان',usd:'تومان',aed:'تومان',oz:'دلار',btc:'دلار'};
var PDEC={g18:0,usd:0,aed:0,oz:2,btc:0};
var REF={t:Date.UTC(2026,10,23,5,31),g18:23458400,usd:267375,aed:72845,oz:3618.03,btc:61211.87};
var state={prices:{g18:null,usd:null,aed:null,oz:null,btc:null,t:{},live:{}},hist:{},items:[],tab:'prices',tourSeen:false};
var editingId=null,pdb=null,pendingPhoto,prevUrl=null,sheetKey=null,sheetRange='day';

/* ---- storage ---- */
var K18={24:999,22:916,21:875,18:750,14:585,9:375};
function migrate(it){
  if(it.karat<=24){var k18=it.karat,nk=K18[k18]||Math.round(k18*1000/24);
    if(it.basis==='raw')it.price=it.price*18/k18;
    it.karat=nk;}
  delete it.basis;if(it.wage==null)it.wage=0;return it;
}
function load(){
  try{
    var r=localStorage.getItem(KEY),old=false;
    if(!r){r=localStorage.getItem(OLDKEY);old=!!r;}
    if(r){var s=JSON.parse(r);
      if(s&&Array.isArray(s.items)){state.items=s.items.map(migrate);}
      if(s&&s.prices){state.prices=Object.assign(state.prices,s.prices);state.prices.t=s.prices.t||{};state.prices.live=s.prices.live||{};}
      if(s&&s.hist)state.hist=s.hist;state.tab=s.tab||'prices';state.tourSeen=!!s.tourSeen;}
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ---- helpers ---- */
var P2L={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function parse(s){if(s==null)return NaN;s=String(s).replace(/[۰-۹٠-٩]/g,function(c){return P2L[c]}).replace(/[,٬،\s]/g,'').replace(/٫/g,'.');if(s==='')return NaN;return Number(s);}
function fa(n,d){if(n==null||!isFinite(n))return '—';return Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d==null?0:d});}
function faM(n){return fa(Math.round(n),0);}
function jd(ts,o){try{return new Date(ts).toLocaleDateString('fa-IR-u-ca-persian',o||{year:'numeric',month:'2-digit',day:'2-digit'});}catch(e){return '';}}
function hm(ts){try{return new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function $(id){return document.getElementById(id);}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function j2g(jy,jm,jd){
  jy+=1595;var days=-355668+(365*jy)+(~~(jy/33))*8+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  var gy=400*~~(days/146097);days%=146097;
  if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*~~(days/1461);days%=1461;
  if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}
  var gd=days+1,sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31],gm;
  for(gm=0;gm<13;gm++){var v=sal[gm];if(gd<=v)break;gd-=v;}
  return [gy,gm,gd];
}
function parseDate(str){
  var t=String(str||'').replace(/[۰-۹٠-٩]/g,function(c){return P2L[c]}).trim().split(/[\/\-.]/).map(Number);
  if(t.length!==3||t.some(function(x){return !isFinite(x)||x<=0;}))return null;
  var y=t[0],m=t[1],d=t[2];if(y<100)y+=1400;if(m>12||d>31)return null;
  if(y>1700)return new Date(y,m-1,d,12).getTime();
  if(m>6&&d>30)return null;
  var g=j2g(y,m,d);return new Date(g[0],g[1]-1,g[2],12).getTime();
}

/* ---- calculations (karat is 3-digit: 750 = 18k) ---- */
function calc(it){
  var w=it.weight*it.karat/750,gold=w*it.price,wage=gold*(it.wage||0)/100,cost=gold+wage,g=state.prices.g18;
  var val=g>0?w*g:null,pl=val==null?null:val-cost;
  return {w:w,gold:gold,wage:wage,cost:cost,val:val,pl:pl,plp:(pl!=null&&cost>0)?pl/cost*100:null};
}
function totals(){
  var t={n:state.items.length,wt:0,w:0,gold:0,cost:0,val:null};
  state.items.forEach(function(it){var c=calc(it);t.wt+=it.weight;t.w+=c.w;t.gold+=c.gold;t.cost+=c.cost;});
  if(state.prices.g18>0)t.val=t.w*state.prices.g18;
  t.avg=t.w>0?t.gold/t.w:null;t.avgW=t.w>0?t.cost/t.w:null;
  t.pl=t.val!=null?t.val-t.cost:null;t.plp=(t.pl!=null&&t.cost>0)?t.pl/t.cost*100:null;
  return t;
}

/* ---- price history & live feed ---- */
function addHist(k,v,ts){
  var h=state.hist[k]=state.hist[k]||[],l=h[h.length-1];
  if(l&&l[1]===v&&ts-l[0]<10*60*1000)return;
  if(l&&ts<=l[0])return;
  h.push([ts,v]);if(h.length>3200)h.splice(0,h.length-3200);
}
function applyRef(){
  PKEYS.forEach(function(k){
    if(state.prices[k]==null||(state.prices.t[k]||0)<REF.t){state.prices[k]=REF[k];state.prices.t[k]=REF.t;state.prices.live[k]=false;}
    if(!(state.hist[k]&&state.hist[k].length))addHist(k,state.prices[k],state.prices.t[k]);
  });
}
var lastPull=0;
function pull(){
  lastPull=Date.now();
  var to=new Promise(function(_,rej){setTimeout(rej,8000);});
  function num(c,k){var o=c&&c[k];if(!o||o.p==null)return 0;return parseFloat(String(o.p).replace(/,/g,''))||0;}
  var rq=fetch(TGJU_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    var c=d&&d.current||{},g=num(c,'geram18');if(!(g>0))throw 0;
    var usd=num(c,'price_dollar_rl'),aed=num(c,'price_aed');
    return {t:Date.now(),g18:g/10,usd:usd?usd/10:0,aed:aed?aed/10:0,oz:num(c,'ons'),btc:num(c,'crypto-bitcoin')};});
  return Promise.race([rq,to]).then(function(j){
    if(!j||!(j.g18>0))return;
    var ts=Number(j.t)||Date.now(),any=false;
    PKEYS.forEach(function(k){var v=Number(j[k]);if(v>0){state.prices[k]=v;state.prices.t[k]=ts;state.prices.live[k]=true;addHist(k,v,ts);any=true;}});
    if(any){save();renderAll();if(sheetKey)renderSheet();}
  }).catch(function(){});
}
setInterval(pull,POLL_MS);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-lastPull>POLL_MS)pull();});

/* ---- prices tab ---- */
function renderPrices(){
  var p=state.prices,h='';
  PKEYS.forEach(function(k){
    var t=p.t[k],live=p.live[k];
    var u=t?(live?'<b>زنده</b> · '+hm(t):'ثبت‌شده · '+jd(t)+' '+hm(t)):'';
    h+='<div class="tile ptile'+(k==='g18'?' full':'')+'" role="button" tabindex="0" data-k="'+k+'"><div class="k">'+PNAME[k]+' <span class="u">'+PUNIT[k]+'</span></div><div class="v">'+(p[k]!=null?fa(p[k],PDEC[k]):'—')+'</div><div class="upd">'+u+'</div></div>';
  });
  function it(k,v,u,cls,full){return '<div class="tile'+(full?' full':'')+'"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+(u?' <span class="u">'+u+'</span>':'')+'</div></div>';}
  if(p.oz>0&&p.usd>0&&p.g18>0){
    var u18=p.oz/31.1035*0.75,imp=u18*p.usd,d=(p.g18/imp-1)*100;
    h+=it('۱۸ عیار از روی انس',fa(u18,2),'دلار')+it('بازار نسبت به جهانی',(d>=0?'+':'')+fa(d,1)+'٪','',d>=0?'pos':'neg')+it('معادل جهانی هر گرم ۱۸',faM(imp),'تومان','',true);
  }
  $('pgrid').innerHTML=h;
}
function shareApp(){
  function say(m){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2a1660;color:#f1c963;border:1px solid #f1c96366;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px';document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
  if(/^https?:/.test(location.protocol)){var link=SHARE_URL||(location.origin+location.pathname);
    if(navigator.share){navigator.share({title:'Ganjeh',text:'گنجه: قیمت طلا و مدیریت موجودی',url:link}).catch(function(){});return;}
    try{navigator.clipboard.writeText(link).then(function(){say('لینک برنامه کپی شد');},function(){say(link);});}catch(e){say(link);}return;}
  var file=null;try{file=new File([SRC],'Ganjeh.html',{type:'text/html'});}catch(e){}

  if(SHARE_URL&&navigator.share){navigator.share({title:'Ganjeh',url:SHARE_URL}).catch(function(){});return;}
  try{var u=URL.createObjectURL(new Blob([SRC],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='Ganjeh.html';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);say('فایل برنامه ذخیره شد');}catch(e){say('ارسال ممکن نشد');}
}
$('pgrid').addEventListener('click',function(e){var t=e.target.closest('[data-k]');if(t)openSheet(t.getAttribute('data-k'));});
$('pgrid').addEventListener('keydown',function(e){if(e.key==='Enter'){var t=e.target.closest('[data-k]');if(t)openSheet(t.getAttribute('data-k'));}});

/* ---- price chart sheet ---- */
var RANGE_MS={day:864e5,week:7*864e5,month:30*864e5};
function series(k,r){
  var cut=Date.now()-RANGE_MS[r],pts=(state.hist[k]||[]).filter(function(x){return x[0]>=cut;});
  if(pts.length>90){var st=Math.ceil(pts.length/90),o=[];for(var i=0;i<pts.length;i+=st)o.push(pts[i]);if(o[o.length-1]!==pts[pts.length-1])o.push(pts[pts.length-1]);pts=o;}
  return pts;
}
function lineChart(pts,dec){
  var W=360,H=210,m={l:8,r:52,t:14,b:26},pw=W-m.l-m.r,ph=H-m.t-m.b;
  var vs=pts.map(function(x){return x[1];}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var pad=(mx-mn)*0.15||mx*0.01;mn-=pad;mx+=pad;
  var t0=pts[0][0],t1=pts[pts.length-1][0],span=(t1-t0)||1;
  var X=function(t){return m.l+(t-t0)/span*pw;},Y=function(v){return m.t+ph-(v-mn)/(mx-mn)*ph;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نمودار قیمت">';
  for(var i=0;i<=3;i++){var gy=m.t+ph*i/3,val=mx-(mx-mn)*i/3;
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-width=".6"/><text class="tx" x="'+(W-m.r+4)+'" y="'+(gy+3)+'">'+fa(val,dec)+'</text>';}
  var line=pts.map(function(x){return X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1);}).join(' ');
  s+='<polygon points="'+X(t0)+','+(m.t+ph)+' '+line+' '+X(t1)+','+(m.t+ph)+'" fill="url(#pl)"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="var(--l1)" stroke-width="2" stroke-linejoin="round"/>';
  var l=pts[pts.length-1];s+='<circle cx="'+X(l[0])+'" cy="'+Y(l[1])+'" r="3.6" fill="#1f1042" stroke="var(--l1)" stroke-width="2"/>';
  [0,.5,1].forEach(function(f){var t=t0+span*f;s+='<text class="tx" x="'+(m.l+pw*f)+'" y="'+(H-8)+'" text-anchor="'+(f===0?'start':f===1?'end':'middle')+'">'+(sheetRange==='day'?hm(t):jd(t,{month:'2-digit',day:'2-digit'}))+'</text>';});
  return s+'</svg>';
}
function renderSheet(){
  var k=sheetKey;if(!k)return;
  $('sh-title').textContent=PNAME[k]+' ('+PUNIT[k]+')';
  document.querySelectorAll('#sh-seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.r===sheetRange?'true':'false');});
  var pts=series(k,sheetRange),box=$('sh-chart'),f=$('sh-facts');
  if(pts.length<2){box.innerHTML='<div class="empty">برای این بازه هنوز داده کافی نیست. با باز بودن برنامه، نمودار کامل می‌شود.</div>';f.innerHTML='';}
  else{
    box.innerHTML=lineChart(pts,PDEC[k]);
    var vs=pts.map(function(x){return x[1];}),a=vs[0],z=vs[vs.length-1],ch=(z/a-1)*100;
    f.innerHTML='<li><span>قیمت فعلی</span><b>'+fa(z,PDEC[k])+'</b></li><li><span>تغییر در این بازه</span><b class="'+(ch>=0?'pos':'neg')+'">'+(ch>=0?'+':'')+fa(ch,2)+'٪</b></li><li><span>کمترین / بیشترین</span><b>'+fa(Math.min.apply(null,vs),PDEC[k])+' / '+fa(Math.max.apply(null,vs),PDEC[k])+'</b></li>';
  }
  $('sh-note').textContent=state.prices.live[k]?'قیمت هر ۱۵ دقیقه به‌روز می‌شود.':'اتصال به قیمت زنده برقرار نیست؛ آخرین قیمت ثبت‌شده نمایش داده می‌شود.';
}
function openSheet(k){sheetKey=k;sheetRange='day';$('sh-in').value='';$('sheet').hidden=false;renderSheet();}

/* ---- photos (IndexedDB) ---- */
function pOpen(){return new Promise(function(res){if(pdb)return res(pdb);try{var r=indexedDB.open('ganjeh-photos',1);r.onupgradeneeded=function(){r.result.createObjectStore('p');};r.onsuccess=function(){pdb=r.result;res(pdb);};r.onerror=function(){res(null);};r.onblocked=function(){res(null);};}catch(e){res(null);}});}
function pTx(mode,fn){return pOpen().then(function(db){if(!db)return null;return new Promise(function(res){try{var tx=db.transaction('p',mode),rq=fn(tx.objectStore('p'));tx.oncomplete=function(){res(rq?rq.result:true);};tx.onerror=tx.onabort=function(){res(null);};}catch(e){res(null);}});});}
function photoPut(id,b){return pTx('readwrite',function(st){return st.put(b,id);});}
function photoGet(id){return pTx('readonly',function(st){return st.get(id);}).then(function(r){return r instanceof Blob?r:null;});}
function photoDel(id){return pTx('readwrite',function(st){return st.delete(id);});}
function resizePhoto(file){return new Promise(function(res){var url=URL.createObjectURL(file),im=new Image();im.onload=function(){var M=1000,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(function(b){res(b);},'image/jpeg',0.75);};im.onerror=function(){URL.revokeObjectURL(url);res(null);};im.src=url;});}
function setPrev(blob){
  if(prevUrl){URL.revokeObjectURL(prevUrl);prevUrl=null;}
  var im=$('f-photo-prev'),del=$('f-photo-del');
  if(blob){prevUrl=URL.createObjectURL(blob);im.src=prevUrl;im.hidden=false;del.hidden=false;}else{im.removeAttribute('src');im.hidden=true;del.hidden=true;}
}
function renderThumbs(){
  document.querySelectorAll('.ph[data-ph]').forEach(function(el){
    photoGet(el.getAttribute('data-ph')).then(function(b){if(!b){el.remove();return;}var im=new Image();im.src=URL.createObjectURL(b);im.alt='';im.dataset.full=im.src;el.appendChild(im);});
  });
}
$('f-photo').addEventListener('change',function(){

});

function startEdit(id){
  var it=state.items.find(function(i){return i.id===id;});if(!it)return;
  editingId=id;showForm(true);$('form-title').textContent='ویرایش قطعه';
  $('f-serial').value=it.serial;$('f-maker').value=it.maker||'';$('f-weight').value=fa(it.weight,3);$('f-karat').value=fa(it.karat,0);
  $('f-wage').value=it.wage?fa(it.wage,2):'';$('f-price').value=fa(it.price,0);$('f-date').value=jd(it.ts);
  pendingPhoto=undefined;setPrev(null);if(it.photo)photoGet(id).then(function(b){if(b&&editingId===id&&pendingPhoto===undefined)setPrev(b);});
  $('msg').textContent='';updatePreview();$('form').scrollIntoView({behavior:'smooth',block:'start'});

function readForm(){return {serial:$('f-serial').value.trim(),maker:$('f-maker').value.trim(),weight:parse($('f-weight').value),karat:parse($('f-karat').value),wage:parse($('f-wage').value),price:parse($('f-price').value),date:$('f-date').value};}
function updatePreview(){
  var f=readForm(),el=$('preview');
  if(!(f.weight>0)||!(f.karat>0)){el.textContent='وزن و عیار را وارد کنید.';return;}
  var w=f.weight*f.karat/750,s='معادل ۱۸ عیار: '+fa(w,3)+' گرم';
  if(f.price>0){var g=w*f.price,wg=g*(isFinite(f.wage)?f.wage:0)/100;s+=' · هزینه کل: '+faM(g+wg)+' تومان';}
  el.textContent=s;
}

$('cancel').onclick=function(){showForm(false);};
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var f=readForm(),m=$('msg');
  if(!f.serial){m.textContent='سریال قطعه را بنویسید.';return;}
  if(!(f.weight>0)){m.textContent='وزن باید بزرگ‌تر از صفر باشد.';return;}
  if(!(f.karat>0&&f.karat<=999)){m.textContent='عیار را سه‌رقمی بنویسید، مثل ۷۵۰.';return;}
  if(isFinite(f.wage)&&(f.wage<0||f.wage>100)){m.textContent='اجرت درصد است، بین ۰ تا ۱۰۰.';return;}
  if(!(f.price>0)){m.textContent='قیمت هر گرم ۱۸ عیار را وارد کنید.';return;}
  var dts=parseDate(f.date);if(!dts){m.textContent='تاریخ را مثل ۱۴۰۵/۰۳/۱۵ بنویسید.';return;}
  var rec={id:editingId||uid(),serial:f.serial,maker:f.maker,weight:f.weight,karat:f.karat,wage:isFinite(f.wage)?f.wage:0,price:f.price,ts:dts};
  var old=editingId?state.items.find(function(i){return i.id===editingId;}):null;
  rec.photo=old?!!old.photo:false;
  if(pendingPhoto instanceof Blob){rec.photo=true;photoPut(rec.id,pendingPhoto).then(renderThumbs);}
  else if(pendingPhoto===null&&rec.photo){rec.photo=false;photoDel(rec.id);}
  pendingPhoto=undefined;setPrev(null);
  if(editingId){state.items=state.items.map(function(i){return i.id===editingId?rec:i;});}else state.items.push(rec);
  save();showForm(false);renderAll();
});

/* ---- analysis ---- */
function niceMax(v){if(!(v>0))return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p,n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}
function renderChart(){
  var box=$('chart'),lg=$('legend');
  var data=state.items.slice().sort(function(a,b){return a.ts-b.ts;});
  if(!data.length){box.innerHTML='<div class="empty">برای دیدن نمودار، دست‌کم یک قطعه ثبت کنید.</div>';lg.innerHTML='';return;}
  var cg=0,cw=0,rows=data.map(function(it){var c=calc(it);cg+=c.gold;cw+=c.w;return {ts:it.ts,w:c.w,p:it.price,avg:cg/cw};}).slice(-14);
  var today=state.prices.g18>0?state.prices.g18:null;
  var W=360,H=250,m={l:34,r:46,t:24,b:28},pw=W-m.l-m.r,ph=H-m.t-m.b,n=rows.length,step=pw/n,bw=Math.min(30,step*0.6);
  var maxW=niceMax(Math.max.apply(null,rows.map(function(r){return r.w;})));
  var all=rows.map(function(r){return r.p;}).concat(rows.map(function(r){return r.avg;}));if(today)all.push(today);
  var pmin=Math.min.apply(null,all),pmax=Math.max.apply(null,all),pad=(pmax-pmin)*0.12||pmax*0.05;pmin=Math.max(0,pmin-pad);pmax+=pad;
  var y1=function(v){return m.t+ph-v/maxW*ph;},y2=function(v){return m.t+ph-(v-pmin)/(pmax-pmin)*ph;},x=function(i){return m.l+step*(i+0.5);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نمودار قیمت و مقدار خرید">';
  for(var k=0;k<=4;k++){var gy=m.t+ph*k/4,lv=maxW*(4-k)/4,pv=pmin+(pmax-pmin)*(4-k)/4;
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-width=".6"/><text class="tx" x="'+(m.l-4)+'" y="'+(gy+3)+'" text-anchor="end">'+fa(lv,lv<10&&lv%1?1:0)+'</text><text class="tx" x="'+(W-m.r+4)+'" y="'+(gy+3)+'">'+fa(pv/1e6,1)+'</text>';}
  s+='<text class="tx" x="'+(m.l-4)+'" y="10" text-anchor="end">گرم ۱۸</text><text class="tx" x="'+(W-2)+'" y="10" text-anchor="end">میلیون تومان</text>';
  rows.forEach(function(r,i){var by=y1(r.w);s+='<rect x="'+(x(i)-bw/2)+'" y="'+by+'" width="'+bw+'" height="'+(m.t+ph-by)+'" rx="2" fill="var(--bar)"/>';});
  s+='<polyline points="'+rows.map(function(r,i){return x(i)+','+y2(r.p);}).join(' ')+'" fill="none" stroke="var(--l1)" stroke-width="1.8" stroke-linejoin="round"/>';
  rows.forEach(function(r,i){s+='<circle cx="'+x(i)+'" cy="'+y2(r.p)+'" r="3" fill="#1f1042" stroke="var(--l1)" stroke-width="1.6"/>';});
  s+='<polyline points="'+rows.map(function(r,i){return x(i)+','+y2(r.avg);}).join(' ')+'" fill="none" stroke="var(--l2)" stroke-width="1.4" stroke-dasharray="4 3"/>';
  if(today){var ty=y2(today);s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+ty+'" y2="'+ty+'" stroke="var(--l3)" stroke-width="1.2" stroke-dasharray="2 3"/><text class="tx" x="'+(m.l+3)+'" y="'+(ty-3)+'" style="fill:var(--l3)">لحظه‌ای</text>';}
  var every=n>8?2:1;rows.forEach(function(r,i){if(i%every===0||i===n-1)s+='<text class="tx" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+jd(r.ts,{month:'2-digit',day:'2-digit'})+'</text>';});
  box.innerHTML=s+'</svg>';
  lg.innerHTML='<span><i style="background:var(--bar)"></i>مقدار خرید (گرم ۱۸)</span><span><i style="background:var(--l1)"></i>قیمت هر گرم در آن خرید</span><span><i style="background:var(--l2)"></i>میانگین تجمعی</span>'+(today?'<span><i style="background:var(--l3)"></i>قیمت لحظه‌ای</span>':'');
}

 {ic:'📈',t:'قیمت‌ها',p:'باکس‌ها قیمت طلای ۱۸ عیار، دلار، درهم، انس و بیت‌کوین هستند و هر ۱۵ دقیقه به‌روز می‌شوند. روی هر باکس بزنید تا نمودار روز، هفته و ماه آن را ببینید.'},
 {ic:'🗄️',t:'گنجه',p:'هر قطعهٔ طلا را با سریال، سازنده، وزن، عیار سه‌رقمی (۷۵۰ یعنی ۱۸ عیار)، اجرت درصدی، قیمت خرید و عکس ثبت کنید. برنامه وزن معادل ۱۸ عیار و ارزش امروز را خودش حساب می‌کند.'},
 {ic:'📊',t:'تحلیل',p:'متوسط قیمت خرید، سود یا زیان، ارزان‌ترین و گران‌ترین خرید و نمودار خریدها اینجاست. همهٔ محاسبات بر پایهٔ قیمت لحظه‌ای است.'},
 {ic:'📱',t:'نصب روی گوشی',p:'در Chrome گوشی اندروید روی منوی سه‌نقطه بزنید و «Install app» یا «افزودن به صفحهٔ اصلی» را انتخاب کنید. اطلاعات شما فقط روی خود گوشی می‌ماند؛ دکمهٔ «؟» بالای صفحه این راهنما را دوباره باز می‌کند.'}
];
var tourI=0;
function showTour(i){
  tourI=i;var s=TOUR[i];$('tour-ic').textContent=s.ic;$('tour-t').textContent=s.t;$('tour-p').textContent=s.p;
  $('tour-dots').innerHTML=TOUR.map(function(_,j){return '<i class="'+(j===i?'on':'')+'"></i>';}).join('');
  $('tour-prev').style.visibility=i?'visible':'hidden';$('tour-next').textContent=i===TOUR.length-1?'شروع':'بعدی';
}
function openTour(){showTour(0);$('tour').hidden=false;}
function closeTour(){$('tour').hidden=true;state.tourSeen=true;save();}
$('tour-next').onclick=function(){if(tourI>=TOUR.length-1)closeTour();else showTour(tourI+1);};
$('tour-prev').onclick=function(){if(tourI>0)showTour(tourI-1);};
$('help-btn').onclick=openTour;
$('share-btn').onclick=shareApp;

/* ---- splash banner ---- */
function inRange(b){var n=new Date().toISOString().slice(0,10);return (!b.from||b.from<=n)&&(!b.to||b.to>=n);}
function loadBanners(){
  var to=new Promise(function(res){setTimeout(function(){res(null);},1500);});
  var rq=fetch(BANNERS_URL+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  return Promise.race([rq,to]).then(function(j){
    var list=j&&Array.isArray(j.banners)?j.banners.filter(function(b){return b&&b.image&&inRange(b);}):[];
    return list.length?list:BUILTIN_BANNERS;
  });
}
function showSplash(){
  return loadBanners().then(function(list){
    var b=list[Math.floor(Math.random()*list.length)];
    return new Promise(function(done){
      var im=$('splash-img'),fin=false,timer=null;
      function end(){if(fin)return;fin=true;clearTimeout(timer);$('splash').hidden=true;done();}
      im.onerror=end;
      im.onload=function(){
        $('splash').hidden=false;
        var bar=document.querySelector('#splash .bar i');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='';
        timer=setTimeout(end,SPLASH_MS);
      };
      $('splash-x').onclick=end;
      if(b.link){im.style.cursor='pointer';im.onclick=function(){try{window.open(b.link,'_blank','noopener');}catch(e){}};}
      im.src=b.image;
    });
  });
}

/* ---- start ---- */
load();applyRef();save();
$('today').textContent=jd(Date.now(),{weekday:'long',year:'numeric',month:'long',day:'numeric'});
renderAll();setTab(state.tab);
pull();
showSplash().then(function(){if(!state.tourSeen)openTour();});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
})();
</script>
