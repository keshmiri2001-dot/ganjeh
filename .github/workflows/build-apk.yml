name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js icon-192.png icon-512.png ads banners.json www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ganjeh.app",
            "appName": "Ganjeh",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          cat > package.json <<'JSON'
          { "name": "ganjeh", "version": "1.0.0", "private": true,
            "dependencies": { "@capacitor/core": "^6.2.0", "@capacitor/cli": "^6.2.0", "@capacitor/android": "^6.2.0" } }
          JSON
      - name: Create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Set app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ganjeh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
